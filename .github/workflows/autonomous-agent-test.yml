name: autonomous-agent-test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic autonomous tests
        run: |
          python -m pytest -q tests/test_autonomous_agent.py tests/test_agent.py
      - name: Run autonomous demo
        run: python demo_autonomous.py
